# Perfil defensivo de proxies para VIGIL
# Defensive proxy profile for VIGIL

# ES: Conexión directa por defecto. No hay rotación de salidas: repartir las
#     peticiones entre varias direcciones sirve para que no te identifiquen, y
#     VIGIL audita identificándose. La cabecera dice quiénes somos en cada
#     petición (src/vigil/identity.py).
#
#     Lo único que se conserva es una salida ÚNICA y opcional por Tor, abajo.
#     Esa no es evasión y la distinción importa: el portal sigue sabiendo
#     perfectamente que quien consulta es VIGIL; lo que no aprende es desde qué
#     casa de Honduras. Protege a la persona, no disfraza al observador.
#
#     El porqué completo está en docs/NO-EVASION.md.
#
# EN: Direct connection by default. No exit rotation: spreading requests across
#     several addresses exists to avoid being identified, and VIGIL audits by
#     identifying itself. The only thing kept is a SINGLE optional Tor exit
#     below. That is not evasion: the portal still knows exactly that VIGIL is
#     asking; what it does not learn is from which house in Honduras. It
#     protects the person, it does not disguise the observer.
mode: direct

# ── Tor / Modo privacidad ──────────────────────────────────────────────────
# ES: Para enrutar TODO el tráfico de monitoreo por Tor (recomendado en
#     jornadas electorales activas), establece en el entorno:
#
#   VIGIL_PRIVACY_MODE=true   # suprime my_url en gossip broadcasts
#   VIGIL_TOR_ENABLED=true    # enruta requests CNE a través del daemon Tor local
#   VIGIL_TOR_PORT=9050       # opcional; éste es el valor por defecto
#
# CRÍTICO: usar socks5h:// (no socks5://) — el sufijo 'h' fuerza la resolución
# DNS dentro de Tor. Sin él, los nombres de host se resuelven localmente y
# el destino queda expuesto.
#
# Verificación antes de activar:
#   curl --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip
#
# EN: To route ALL monitoring traffic through Tor (recommended during active
#     election periods), set in the environment:
#
#   VIGIL_PRIVACY_MODE=true   # suppresses my_url in gossip broadcasts
#   VIGIL_TOR_ENABLED=true    # routes CNE requests through local Tor daemon
#   VIGIL_TOR_PORT=9050       # optional; this is the default
#
# CRITICAL: use socks5h:// (not socks5://) — the 'h' suffix forces DNS
# resolution inside Tor. Without it, hostnames resolve locally and the
# destination is leaked.
#
# Pre-activation check:
#   curl --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip
