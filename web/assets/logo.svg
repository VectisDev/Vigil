<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="600" height="150" role="img" aria-labelledby="t">
  <title id="t">VIGIL — Trustless Electoral Integrity</title>
  <defs>
    <linearGradient id="blk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Mark: a V of chained hash blocks converging on the Bitcoin anchor -->
  <g transform="translate(14 14)">
    <g stroke="#94A3B8" stroke-width="3" stroke-linecap="round">
      <line x1="22" y1="22" x2="41" y2="60"/>
      <line x1="41" y1="60" x2="60" y2="98"/>
      <line x1="60" y1="98" x2="79" y2="60"/>
      <line x1="79" y1="60" x2="98" y2="22"/>
    </g>
    <g fill="url(#blk)">
      <rect x="10" y="10" width="24" height="24" rx="6"/>
      <rect x="29" y="48" width="24" height="24" rx="6"/>
      <rect x="67" y="48" width="24" height="24" rx="6"/>
      <rect x="86" y="10" width="24" height="24" rx="6"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
      <line x1="16" y1="19" x2="28" y2="19"/><line x1="16" y1="25" x2="24" y2="25"/>
      <line x1="35" y1="57" x2="47" y2="57"/><line x1="35" y1="63" x2="43" y2="63"/>
      <line x1="73" y1="57" x2="85" y2="57"/><line x1="73" y1="63" x2="81" y2="63"/>
      <line x1="92" y1="19" x2="104" y2="19"/><line x1="92" y1="25" x2="100" y2="25"/>
    </g>
    <rect x="46" y="84" width="28" height="28" rx="7" fill="#F59E0B"/>
    <circle cx="60" cy="98" r="6" fill="none" stroke="#FFFFFF" stroke-width="2.6"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="92" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="10" fill="#0F172A">VIGIL</text>
  <text x="163" y="124" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="4.2" fill="#475569">TRUSTLESS ELECTORAL INTEGRITY</text>
</svg>
