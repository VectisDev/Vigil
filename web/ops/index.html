  <div id="auth-card">
    <a class="vigil-lockup" href="../" aria-label="VIGIL inicio"><picture class="mark-light"><img alt="VIGIL — Integridad electoral verificable" src="../assets/brand/vigil-horizontal-corto.svg" height="28"></picture><picture class="mark-dark"><source media="(prefers-color-scheme: dark)" srcset="../assets/brand/vigil-horizontal-corto-oscuro.svg"><img alt="" src="../assets/brand/vigil-horizontal-corto-oscuro.svg" height="28"></picture></a>
    <h1>Administración</h1>
    <p>Acceso restringido. La clave no se muestra después de entrar.</p>
    <label for="adm-pass">Clave de acceso</label>
    <input type="password" id="adm-pass" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAdminLogin()">
    <button type="button" id="btn-login" onclick="doAdminLogin()">Entrar</button>
    <button type="button" class="theme-toggle" data-theme-text="1">Noche</button>
    <p class="error" id="auth-err" role="alert"></p>
  </div>
</div>

<div id="admin-shell">
  <a class="skip" href="#main-area" id="skip">Saltar al contenido</a>
  <header class="mast">
    <div class="sim" id="sim-banner">Sin nodo de control</div>
    <div class="bar">
      <a class="vigil-lockup" href="../" aria-label="VIGIL inicio"><picture class="mark-light"><img alt="VIGIL — Integridad electoral verificable" src="../assets/brand/vigil-horizontal-corto.svg" height="28"></picture><picture class="mark-dark"><source media="(prefers-color-scheme: dark)" srcset="../assets/brand/vigil-horizontal-corto-oscuro.svg"><img alt="" src="../assets/brand/vigil-horizontal-corto-oscuro.svg" height="28"></picture></a>

      <button type="button" class="ops-tab" data-tab-btn="red" onclick="goTab('red')">Sala<small>observadores conectados</small></button>
      <button type="button" class="ops-tab" data-tab-btn="avanzado" onclick="goTab('avanzado')">Controles</button>
    </nav>
  </header>

<script src="../config.js"></script>
<script src="js/ops-core.js?v=20261108v4"></script>
<script src="js/ops-tabs.js?v=20261108v4"></script>
<script src="js/ops-v4.js?v=20261108v4"></script>
<script>
let currentUser = null;

async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}

async function doAdminLogin(prefillKey) {
  const pass = (prefillKey || document.getElementById('adm-pass').value || '').trim();
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('auth-err');
  if (!pass) { err.textContent = 'Ingresa la clave de acceso.'; return; }
  btn.disabled = true;
  err.textContent = '';
  try {
    const r = await fetch(new URL('../access.json', location.href).href + '?t=' + Date.now());
    if (!r.ok) {
      err.textContent = 'No se pudo cargar la configuración (HTTP ' + r.status + ').';
      btn.disabled = false;
      return;
    }
    const ac = await r.json();
    const candidate = ((ac.version || 0) >= 3 || ac.method === 'SHA-256')
      ? await sha256Hex(pass)
      : null;
    if (!candidate) {
      err.textContent = 'Esta página solo acepta claves en el formato actual.';
      btn.disabled = false;
      return;
    }
    const seeds = Array.isArray(ac.seeds) ? ac.seeds : [];
    let matchedRole = 'operador';
    const matched = seeds.some((h) => {
      if (typeof h === 'string') return h === candidate;
      if (h && h.hash === candidate) { matchedRole = h.role || 'operador'; return true; }
      return false;
    });
    if (!matched) {
      err.textContent = 'Clave incorrecta.';
      btn.disabled = false;
      return;
    }
    sessionStorage.setItem('centinel_admin_tok', 'operador');
    sessionStorage.setItem('centinel_admin_exp', String(Date.now() + 8 * 3600 * 1000));
    sessionStorage.setItem('centinel_role', matchedRole);
    currentUser = { role: matchedRole };
    if (location.hash && /^[A-Za-z0-9_-]{24}$/.test(location.hash.slice(1))) {
      history.replaceState(null, '', location.pathname + location.search);
    }
    showAdminShell();
  } catch (e) {
    err.textContent = 'Error al verificar.';
    btn.disabled = false;
  }
}

function doLogout() {
  sessionStorage.removeItem('centinel_admin_tok');
  sessionStorage.removeItem('centinel_admin_exp');
  sessionStorage.removeItem('centinel_role');
  location.reload();
}

async function showAdminShell() {
  const auth = document.getElementById('auth-screen');
  const shell = document.getElementById('admin-shell');
  if (auth) auth.style.display = 'none';
  if (shell) shell.style.display = 'block';
  await detectMode();
  document.body.classList.remove('ops-mode-pages', 'ops-mode-servidor');
  document.body.classList.add('ops-mode-' + window.OPS_MODE);
  try { initOpsTabs(); } catch (e) { /* la vista sigue en inicio */ }
  if (typeof opsV4Start === 'function') {
    try { await opsV4Start(); } catch (e) { /* sin lectura no es un fallo de la página */ }
  }
  try { renderOverallState(); } catch (e) { /* el titular puede quedar en la vista */ }
}
window.showAdminShell = showAdminShell;

(function () {
  const tok = sessionStorage.getItem('centinel_admin_tok');
  const exp = parseInt(sessionStorage.getItem('centinel_admin_exp') || '0', 10);
  if (tok && Date.now() < exp) showAdminShell();
})();
</script>
</body>
</html>
