name: Hash Chain Commit

# ponytail: merged export-forensic-trail.yml into this file (same daily schedule,
# same runner, same setup steps). Re-split if forensic export needs independent triggers.

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forensic-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Export reputation events
        run: python src/centinel/federation/export_reputation.py

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: forensic_trail.json
          tag_name: forensic-${{ github.run_number }}-${{ github.run_attempt }}
          name: Forensic Trail Export #${{ github.run_number }}
          body: |
            Automated forensic trail export from reputation events database.

            Generated: ${{ github.event.repository.updated_at }}
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit:
    needs: forensic-export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Commit to hash chain
        run: python src/centinel/federation/hash_chain.py

      - name: Push hash chain branch
        run: |
          git push origin data/reputation --force-with-lease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create chain verification
        run: |
          git log refs/heads/data/reputation --oneline -10 > chain-verification.txt
          cat chain-verification.txt
