name: Wiki Sync

# Publica docs/wiki/ en la wiki de GitHub. La wiki se edita solo desde el repo,
# así cada cambio pasa por revisión. / Publishes docs/wiki/ to the GitHub wiki,
# so the wiki is only edited through reviewed repository changes.

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**", ".github/workflows/wiki-sync.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Publish docs/wiki to the wiki repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/wiki
          rsync -a --delete --exclude .git docs/wiki/ /tmp/wiki/
          cd /tmp/wiki
          git config user.name "userf8a2c4"
          git config user.email "250608616+userf8a2c4@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "docs(wiki): sync from ${GITHUB_SHA::8}"
          git push origin HEAD
