# VIGIL — Continuous Poller A
# ================================
# Job long-running que corre 5.5h dentro de GitHub Actions.
# Long-running job that runs 5.5h inside GitHub Actions.
#
# Estrategia de overlap / Overlap strategy:
#   Poller A: 00:00, 06:00, 12:00, 18:00 UTC
#   Poller B: 03:00, 09:00, 15:00, 21:00 UTC
#
#   A corre: 00:00 → 05:30
#   B corre: 03:00 → 08:30
#   Overlap: 03:00 → 05:30 (ambos activos)
#   Gap:     CERO ✅
#
# GitHub ve: 2 jobs de 20 disponibles = sin problema
# GitHub sees: 2 of 20 available jobs = no problem
#
# Repo público → minutos de Actions ILIMITADOS
# Public repo → UNLIMITED Actions minutes
#
# Free tier / Costo cero ✅

name: centinel-poller-A

on:
  schedule:
    # Arrancar cada 6h en: 00:00, 06:00, 12:00, 18:00 UTC
    # Start every 6h at: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'

  workflow_dispatch:
    inputs:
      interval_minutes:
        description: 'Intervalo de polling en minutos / Polling interval in minutes'
        required: false
        default: '3'
      max_runtime_seconds:
        description: 'Tiempo máximo en segundos / Max runtime in seconds'
        required: false
        default: '19200'

# CRÍTICO: Singleton — evitar dos instancias de A simultáneas
# CRITICAL: Singleton — prevent two simultaneous A instances
concurrency:
  group: centinel-poller-A-singleton
  cancel-in-progress: false  # Nunca matar el job activo / Never kill active job

permissions:
  contents: read

jobs:
  # Los pollers corren 5,5 horas seguidas haciendo peticiones. Son, con
  # diferencia, el mayor consumidor de la cuota etica del proyecto, y hasta
  # ahora comprobaban el modo pero no si el repositorio era un fork ni si la
  # configuracion seguia dentro del techo de 19 endpoints.
  # English: the pollers run for 5.5 hours making requests. They are by far
  # the largest consumer of the project's ethical budget, and until now they
  # checked the mode but neither whether the repository was a fork nor
  # whether the config still sat within the 19-endpoint ceiling.
  gate:
    uses: ./.github/workflows/_gate.yml
    # El gate solo decide; no escribe nada. Sin este bloque hereda el
    # defecto del repositorio, que suele ser amplio, para una llamada que
    # unicamente necesita leer el arbol.
    # English: the gate only decides and writes nothing. Without this block it
    # inherits the repository default, usually broad, for a call that only
    # needs to read the tree.
    permissions:
      contents: read
    with:
      purpose: poller-A

  continuous-poll-A:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest

    # 330 min = 5.5h — margen antes del límite de 6h de GitHub
    # 330 min = 5.5h — margin before GitHub's 6h limit
    timeout-minutes: 330

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install aiohttp pyyaml

      - name: Configure git identity
        run: |
          git config user.name "VectisDev"
          git config user.email "VectisDev@users.noreply.github.com"

      # El marcador ELECTION_CLOSED hacia `exit 0` dentro de su propio paso, lo
      # que termina ESE paso y no el job: los pasos siguientes se ejecutaban
      # igualmente. El unico freno a la captura era decorativo.
      # English: the ELECTION_CLOSED marker did `exit 0` inside its own step,
      # ending THAT step and not the job, so the steps below ran anyway. The
      # only brake on collection was decorative.
      # El modo lo resolvio el job `gate`. Este job solo existe si dijo
      # que si, asi que los `if:` por paso sobran.
      # English: the mode was resolved by the `gate` job.
      - name: Setup data branch
        run: |
          # Snapshots go to a dedicated 'snapshots' branch (separate history).
          # NOTE: this branch CANNOT be named 'data' — that name conflicts with
          # the existing data/reputation ref (git ref namespace: file vs dir).
          git fetch origin snapshots:snapshots 2>/dev/null || \
            (git checkout --orphan snapshots-init && \
             git commit --allow-empty -m "init: snapshots branch" && \
             git push origin HEAD:snapshots && \
             git checkout -) || true

      - name: Refuse an unverified pace override
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/check_rate_override.py

      - name: Run continuous poller A
        env:
          POLL_INTERVAL:      ${{ inputs.interval_minutes || '3' }}
          MAX_RUNTIME:        ${{ inputs.max_runtime_seconds || '19200' }}
          DATA_BRANCH:        "snapshots"
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/vigil/core/poller_async.py \
            --interval    $POLL_INTERVAL \
            --max-runtime $MAX_RUNTIME \
            --data-branch $DATA_BRANCH \
            --allow-no-endpoints

      - name: Summary on exit
        if: always()
        run: |
          echo "=== Poller A exit summary ==="
          if [ -f data/latest_cycle.json ]; then
            python3 -c "
          import json
          d = json.load(open('data/latest_cycle.json'))
          ok = sum(1 for r in d['results'] if r['success'])
          print(f\"Last cycle: {d['cycle']} | hash: {d['cycle_hash'][:16]} | ok: {ok}/{len(d['results'])}\")
            "
          fi
          if [ -f data/poller_chain.jsonl ]; then
            echo "Chain entries: $(wc -l < data/poller_chain.jsonl)"
          fi
