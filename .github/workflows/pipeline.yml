name: Vigil Pipeline CI

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

# Security: explicit minimal permissions.
permissions:
  contents: read

# Cancel any in-progress run before starting a new one.
# Prevents minute pile-up if a run takes longer than the schedule interval.
concurrency:
  group: centinel-pipeline
  cancel-in-progress: true

jobs:
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Debug environment
        run: |
          echo "Python: $(python --version)"
          echo "Poetry: $(poetry --version)"
          ls -la
          ls -la data || true
      # El marcador ELECTION_CLOSED hacia `exit 0` dentro de su propio paso, lo
      # que termina ESE paso y no el job: el colector de abajo se ejecutaba
      # igualmente. El unico freno a la captura era decorativo. Ahora el modo
      # resuelto condiciona los pasos siguientes con `if:`, que si los salta.
      # English: the ELECTION_CLOSED marker did `exit 0` inside its own step,
      # which ends THAT step and not the job: the collector below ran anyway.
      # The only brake on collection was decorative. The resolved mode now
      # gates the following steps with `if:`, which does skip them.
      - name: Resolve node mode
        id: mode
        run: poetry run python .github/scripts/resolve_mode.py

      - name: Run collector
        if: steps.mode.outputs.go == 'true'
        run: |
          if ! poetry run python -m scripts.collector; then
            echo "Error details: collector failed"
            ls -la data || true
            exit 1
          fi

      - name: Explain why nothing was collected
        if: steps.mode.outputs.go != 'true'
        run: |
          echo "Modo ${{ steps.mode.outputs.mode }}: no se captura nada."
          echo "Motivo: ${{ steps.mode.outputs.reason }}"
          echo "Cero peticiones a la fuente. Esto no es un fallo."

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Debug environment
        run: |
          echo "Python: $(python --version)"
          ls -la data || true
          ls -la hashes || true
      - name: Ejecutar snapshot y hash
        run: |
          if ! poetry run python -m scripts.snapshot; then
            echo "Error details: snapshot/hash failed"
            ls -la data || true
            ls -la hashes || true
            exit 1
          fi


  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: audit
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      # El exportador es solo-stdlib a proposito; resolve_mode necesita yaml.
      # English: the exporter is stdlib-only on purpose; resolve_mode needs yaml.
      - name: Install mode resolver dependency
        run: python -m pip install --quiet "PyYAML>=6.0.2,<7.0.0"

      - name: Resolve node mode
        id: mode
        run: python .github/scripts/resolve_mode.py

      # Sin --mode el exportador no sabe si la ausencia de datos es un fallo o
      # el estado correcto, y declara NO_DATA saliendo en rojo. Entre
      # elecciones eso seria un rojo permanente.
      # English: without --mode the exporter cannot tell whether absent data is
      # a failure or the correct state, and declares NO_DATA with a red exit.
      # Between elections that would be a permanent red.
      - name: Export static snapshot
        run: |
          python scripts/export_static_snapshot.py \
            --mode "${{ steps.mode.outputs.mode }}" \
            --mode-reason "${{ steps.mode.outputs.reason }}"
      - name: Commit and push snapshot.json
        run: |
          git config user.name "VectisDev"
          git config user.email "VectisDev@users.noreply.github.com"
          git add web/data/snapshot.json
          git diff --cached --quiet || \
            git commit -m "data: snapshot $(date -u +%Y%m%dT%H%MZ) [skip ci]"
          git push

      - name: Push data to centinel-data
        if: always()
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "INFO: DATA_REPO_TOKEN not configured — data stays local"
            exit 0
          fi
          git clone "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${REPO_OWNER}/centinel-data.git" /tmp/centinel-data
          mkdir -p /tmp/centinel-data/snapshots/latest
          [ -f web/data/snapshot.json ] && cp web/data/snapshot.json /tmp/centinel-data/snapshots/latest/ || true
          cd /tmp/centinel-data
          git config user.name "VectisDev"
          git config user.email "VectisDev@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install security dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pytest==8.3.3 psutil pyyaml flask requests opentimestamps-client
      - name: Debug security context
        run: |
          pwd
          ls -la
          ls -la scripts || true
          ls -la tests || true
      - name: Run Bandit (developer-friendly in dev branches)
        run: |
          if [[ "${GITHUB_REF_NAME}" == dev-v* || "${GITHUB_REF_NAME}" == "work" ]]; then
            bandit -r . -c .github/bandit.yaml --severity-level medium || true
          else
            bandit -r . -c .github/bandit.yaml --severity-level medium
          fi
      - name: Run security suites
        run: |
          if [[ "${GITHUB_REF_NAME}" == dev-v* || "${GITHUB_REF_NAME}" == "work" ]]; then
            make security || true
          else
            make security
          fi
