name: Vigil Pipeline CI

# Sin horario: la captura periodica vive en audit.yml y en ningun otro sitio.
#
# Este workflow declaraba `*/30` y compartia el grupo `centinel-pipeline` con
# `cancel-in-progress: true` junto a scheduler.yml, que declaraba `*/15`. Dos
# horarios distintos en un grupo que cancela: el que disparaba segundo mataba
# al primero en vuelo. Medido sobre el historial del repositorio, la cadencia
# observada tenia mediana de 283 minutos frente a los 30 declarados.
#
# English: no schedule. This declared */30 and shared a cancelling concurrency
# group with scheduler.yml's */15, so whichever fired second killed the other
# mid-flight. Measured over the repo's history, observed cadence had a median
# of 283 minutes against the 30 declared.
#
# Solo despacho manual. No se le anaden disparadores de PR o push: su job
# `publish` commitea web/data/snapshot.json, y correrlo desde un PR intentaria
# escribir desde un contexto que no debe escribir. El CI de PR es ci.yml.
# English: manual dispatch only. No PR or push triggers are added: its
# `publish` job commits web/data/snapshot.json, and running it from a PR would
# write from a context that must not write. PR CI lives in ci.yml.
on:
  workflow_dispatch:

# Security: explicit minimal permissions.
permissions:
  contents: read

concurrency:
  group: vigil-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # El gate solo decide sobre la captura. Los demas jobs (audit, publish,
  # security) son analisis sobre lo que ya hay en el arbol y no emiten
  # peticiones a la fuente, asi que corren siempre.
  # English: the gate decides about collection only. The other jobs analyse
  # what is already in the tree and issue no requests to the source.
  gate:
    uses: ./.github/workflows/_gate.yml
    permissions:
      contents: read
    with:
      purpose: pipeline

  collector:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Debug environment
        run: |
          echo "Python: $(python --version)"
          echo "Poetry: $(poetry --version)"
          ls -la
          ls -la data || true
      # El marcador ELECTION_CLOSED hacia `exit 0` dentro de su propio paso, lo
      # El modo lo resuelve el job `gate`, unico punto de decision. Este job
      # solo existe si dijo que si, asi que los `if:` por paso sobran.
      # English: the mode is resolved by the `gate` job, the single decision
      # point. This job only exists if it said yes.
      - name: Run collector
        run: |
          if ! poetry run python -m scripts.collector; then
            echo "Error details: collector failed"
            ls -la data || true
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `collector` ahora puede saltarse (modo REPLAY o ARMED), y un `needs` a
    # un job saltado salta tambien el dependiente. `always()` mas la
    # comprobacion explicita de fallo conserva el orden sin encadenar el
    # salto: el analisis sobre el arbol debe correr aunque no se capturara.
    # English: `collector` can now be skipped, and `needs` on a skipped job
    # skips the dependent too. `always()` plus an explicit failure check keeps
    # the ordering without propagating the skip.
    needs: collector
    if: always() && needs.collector.result != 'failure'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Debug environment
        run: |
          echo "Python: $(python --version)"
          ls -la data || true
          ls -la hashes || true
      - name: Ejecutar snapshot y hash
        run: |
          if ! poetry run python -m scripts.snapshot; then
            echo "Error details: snapshot/hash failed"
            ls -la data || true
            ls -la hashes || true
            exit 1
          fi


  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: audit
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      # El exportador es solo-stdlib a proposito; resolve_mode necesita yaml.
      # English: the exporter is stdlib-only on purpose; resolve_mode needs yaml.
      - name: Install mode resolver dependency
        run: python -m pip install --quiet "PyYAML>=6.0.2,<7.0.0"

      - name: Resolve node mode
        id: mode
        run: python .github/scripts/resolve_mode.py

      # Sin --mode el exportador no sabe si la ausencia de datos es un fallo o
      # el estado correcto, y declara NO_DATA saliendo en rojo. Entre
      # elecciones eso seria un rojo permanente.
      # English: without --mode the exporter cannot tell whether absent data is
      # a failure or the correct state, and declares NO_DATA with a red exit.
      # Between elections that would be a permanent red.
      - name: Export static snapshot
        run: |
          python scripts/export_static_snapshot.py \
            --mode "${{ steps.mode.outputs.mode }}" \
            --mode-reason "${{ steps.mode.outputs.reason }}"
      - name: Commit and push snapshot.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/commit_via_api.py \
            --branch "${GITHUB_REF_NAME}" \
            --message "data: snapshot $(date -u +%Y%m%dT%H%MZ) [skip ci]" \
            -- web/data/snapshot.json

      - name: Push data to centinel-data
        if: always()
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "INFO: DATA_REPO_TOKEN not configured — data stays local"
            exit 0
          fi
          git clone "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${REPO_OWNER}/centinel-data.git" /tmp/centinel-data
          mkdir -p /tmp/centinel-data/snapshots/latest
          [ -f web/data/snapshot.json ] && cp web/data/snapshot.json /tmp/centinel-data/snapshots/latest/ || true
          cd /tmp/centinel-data
          GH_TOKEN="$DATA_REPO_TOKEN" python3 "$GITHUB_WORKSPACE/.github/scripts/commit_via_api.py" \
            --repository "${REPO_OWNER}/centinel-data" \
            --branch main \
            --root /tmp/centinel-data \
            --sync \
            --message "data: $(date -u +'%Y-%m-%d %H:%M UTC')" \
            -- .

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install security dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pytest==8.3.3 psutil pyyaml flask requests opentimestamps-client
      - name: Debug security context
        run: |
          pwd
          ls -la
          ls -la scripts || true
          ls -la tests || true
      - name: Run Bandit (developer-friendly in dev branches)
        run: |
          if [[ "${GITHUB_REF_NAME}" == dev-v* || "${GITHUB_REF_NAME}" == "work" ]]; then
            bandit -r . -c .github/bandit.yaml --severity-level medium || true
          else
            bandit -r . -c .github/bandit.yaml --severity-level medium
          fi
      - name: Run security suites
        run: |
          if [[ "${GITHUB_REF_NAME}" == dev-v* || "${GITHUB_REF_NAME}" == "work" ]]; then
            make security || true
          else
            make security
          fi
