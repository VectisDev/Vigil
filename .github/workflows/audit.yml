name: Vigilante Electoral Permanente

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      election_mode:
        description: 'Modo noche electoral — captura cada 30 min en vez de 3 horas (actívalo antes de la noche electoral)'
        type: boolean
        default: false
  schedule:
    - cron: '0 */3 * * *'  # Cada 3 horas (cambia a '*/30 * * * *' para pruebas)

# Una captura encolada que espera es aceptable; una cancelada pierde el ciclo.
# Por eso `false`: a diferencia de scheduler.yml y pipeline.yml, que compartian
# grupo CON cancelacion y se mataban mutuamente, aqui el solapamiento se
# resuelve esperando. El grupo lleva el nombre del repositorio para que dos
# nodos distintos no compitan entre si.
# English: a queued capture that waits is acceptable; a cancelled one loses the
# cycle. Hence `false`. The group carries the repository name so two separate
# nodes never contend with each other.
concurrency:
  group: vigil-capture-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Este workflow era el unico de los cinco de captura sin ninguna comprobacion
  # de modo: #789 cableo scheduler, pipeline, poller-A y poller-B, y dejo fuera
  # justo el que corre cada tres horas. Hasta aqui, un repositorio creado desde
  # plantilla empezaba a consultar el portal del CNE cada tres horas por el solo
  # hecho de existir.
  # English: this was the one capture workflow with no mode check at all. Until
  # now, a repository created from the template began querying the CNE portal
  # every three hours simply by existing.
  gate:
    uses: ./.github/workflows/_gate.yml
    # El token del workflow es de lectura. Este job solo decide.
    # English: the workflow token is read-only. This job only decides.
    permissions:
      contents: read
    with:
      purpose: audit

  audit:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      issues: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar snapshot y hash
        run: python -m scripts.download_and_hash

      - name: Ejecutar diffs si aplica
        run: python scripts/calculate_diffs.py || echo "No hay suficientes snapshots para diffs"

      - name: Commit y push con resiliencia (3 intentos)
        id: git_push
        run: |
          set +e
          out=$(GH_TOKEN="${{ github.token }}" python3 .github/scripts/commit_via_api.py \
            --branch main \
            --message "Actualización automática: snapshot y diffs $(date +'%Y-%m-%d %H:%M')" \
            -- data hashes diffs reports 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" != 0 ]; then
            echo "pushed=failed" >> $GITHUB_OUTPUT
            exit 0
          fi
          if printf '%s' "$out" | grep -q "sin cambios"; then
            echo "pushed=skipped" >> $GITHUB_OUTPUT
          else
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Notificar fallo de publicacion (ntfy + Issue)
        if: steps.git_push.outputs.pushed == 'failed'
        env:
          VIGIL_NTFY_TOPIC: ${{ secrets.VIGIL_NTFY_TOPIC || secrets.CENTINEL_NTFY_TOPIC }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // ntfy
            const topic = process.env.VIGIL_NTFY_TOPIC;
            if (topic) {
              await fetch(`https://ntfy.sh/${topic}`, {
                method: 'POST',
                headers: { 'Priority': 'high', 'Tags': 'warning,floppy_disk' },
                body: `Vigil — la publicacion firmada fallo en audit. Los datos estan en disco y se reintentaran en el proximo ciclo (3h).`
              }).catch(() => {});
            }
            // Open Issue (deduplication)
            const existing = await github.rest.issues.listForRepo({
              owner, repo, labels: 'centinel-git-error', state: 'open', per_page: 1
            });
            if (existing.data.length > 0) return;
            await github.rest.issues.create({
              owner, repo,
              title: 'Error persistente al publicar el audit — datos locales no sincronizados',
              labels: ['centinel-git-error'],
              body: [
                '## El workflow `audit.yml` no pudo publicar el commit firmado.',
                '',
                '**Los datos capturados están seguros en disco.** Se reintentará en el próximo ciclo (3 horas).',
                '',
                '### Causa probable',
                '',
                '- Conflicto de rama no resoluble (push de otro proceso simultaneo)',
                '- El runner perdió conectividad durante el push',
                '',
                '### Si el error persiste en el próximo ciclo',
                '',
                '1. Verifica que no haya otro proceso escribiendo al mismo branch',
                `2. Revisa los logs: **[→ Actions → Vigilante Electoral](https://github.com/${owner}/${repo}/actions/workflows/audit.yml)**`,
                '3. Vuelve a lanzar el workflow. No fuerces la rama por defecto.',
                '',
                '> Este issue se cerrará automáticamente cuando el próximo ciclo complete con éxito.',
              ].join('\n')
            });

      - name: Cerrar issue de git si push fue exitoso
        if: steps.git_push.outputs.pushed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'centinel-git-error', state: 'open'
            });
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ **Resuelto automáticamente.** El siguiente ciclo de audit completó con éxito.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed'
              });
            }

      - name: Push data to centinel-data
        if: always()
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "INFO: DATA_REPO_TOKEN not configured — data stays local"
            exit 0
          fi
          git clone "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${REPO_OWNER}/centinel-data.git" /tmp/centinel-data
          [ -d data ]    && cp -r data/.    /tmp/centinel-data/snapshots/ || true
          [ -d hashes ]  && cp -r hashes/.  /tmp/centinel-data/hashes/   || true
          [ -d diffs ]   && cp -r diffs/.   /tmp/centinel-data/diffs/    || true
          [ -d reports ] && cp -r reports/. /tmp/centinel-data/reports/  || true
          cd /tmp/centinel-data
          GH_TOKEN="$DATA_REPO_TOKEN" python3 "$GITHUB_WORKSPACE/.github/scripts/commit_via_api.py" \
            --repository "${REPO_OWNER}/centinel-data" \
            --branch main \
            --root /tmp/centinel-data \
            --sync \
            --message "data: $(date -u +'%Y-%m-%d %H:%M UTC')" \
            -- .
