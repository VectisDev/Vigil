name: Join a room

# One input. No schedule, so a copy of this repository does not call anyone.
on:
  workflow_dispatch:
    inputs:
      room_code:
        description: Room code
        required: true
        type: string

permissions:
  contents: read

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Join
        env:
          ROOM_CODE: ${{ inputs.room_code }}
        run: python3 scripts/swarm_node_run.py
