# VIGIL — Multi-platform code & evidence mirroring
# Mirror automático multi-plataforma para código y evidencia
#
# Audit finding addressed: Point 4 — GitHub monoculture (single-platform dependency).
# Hallazgo de auditoría: Punto 4 — Monocultura GitHub.
#
# What this workflow does / Qué hace este workflow:
# 1. Mirrors the full git history (all branches and tags) to Codeberg
#    (Forgejo, EU-based, non-profit).
#    Espeja todo el historial git (ramas y tags) a Codeberg.
# 2. Uploads a signed git bundle of the current HEAD to the Internet
#    Archive, which acts as an independent, jurisdictionally-distinct
#    preservation node.
#    Sube un bundle git firmado del HEAD actual al Internet Archive,
#    que actúa como nodo de preservación independiente y de
#    jurisdicción distinta.
# 3. Logs the mirror operation on the branch `data/mirror-log`, not on main.
#    Registra la operación en la rama `data/mirror-log`, no en main.
#
# Triggers / Disparadores:
# - On push to main or dev-v12 (primary branches per project convention).
# - Every 6 hours (periodic re-verification + tag mirroring).
# - Manually via workflow_dispatch (for ad-hoc full re-sync).
#
# Cost: $0 — uses only GitHub Actions free tier minutes, Codeberg free
# tier (no published quota — courtesy use), and Internet Archive free
# tier (rate-limited but free).
#
# Coste: $0 — usa solo los minutos gratuitos de GitHub Actions, el tier
# gratuito de Codeberg y el tier gratuito de Internet Archive.
#
# Secrets required / Secretos requeridos:
# - CODEBERG_TOKEN: Personal access token from codeberg.org, scope: write.
#   Token de acceso personal de codeberg.org con permiso de escritura.
# - IA_ACCESS_KEY, IA_SECRET_KEY: Internet Archive S3-compatible keys
#   from https://archive.org/account/s3.php (free).
#   Claves S3-compatibles del Internet Archive (gratuitas).

name: Resilience Mirror

on:
  push:
    branches:
      - main
      - dev-v12
    tags:
      - 'v*'
  # Scheduled mirroring is disabled. Re-enable only once the mirrored history
  # is known to contain no operator-identifying metadata.
  # El espejo programado está desactivado. Reactivar solo cuando se verifique
  # que el historial replicado no contiene metadatos que identifiquen al operador.
  # schedule:
  #   - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      full_resync:
        description: 'Force full resync of all branches and tags'
        required: false
        type: boolean
        default: false

# Concurrency: only one mirror operation at a time.
# Concurrencia: solo una operación de espejo a la vez.
concurrency:
  group: resilience-mirror
  cancel-in-progress: false  # Let in-flight mirrors complete.

permissions:
  contents: read

# El destino del espejo se declara. No va a fuego, y tampoco se adivina.
#
# Estaba escrito literalmente como `codeberg.org/VectisDev/centinel.git`. En un
# repositorio creado desde plantilla eso apunta al espejo del operador
# original: cualquiera que configurase su propio CODEBERG_TOKEN empujaria su
# historia al Codeberg de otra persona, con --force y sobre todas las ramas.
#
# El intento obvio -- derivarlo de `github.event.repository.name` -- se probo y
# esta mal, y el fallo lo demostro en produccion: este repositorio se llama
# `Vigil` en GitHub y su espejo se llama `centinel`, porque se renombro en un
# sitio y no en el otro. El nombre del espejo es independiente del nombre en
# GitHub y no hay forma de deducirlo. Peor: Codeberg respondio
# `Push to create is not enabled for users`, lo que significa que con esa
# opcion activada la derivacion habria CREADO un repositorio con el nombre
# adivinado y le habria empujado todas las ramas con --force.
#
# Asi que se exige declararlo. Sin `vars.CODEBERG_REPO` el espejo se salta y lo
# dice; no se empuja a un destino supuesto. Es la misma regla que el resto del
# proyecto: ante la duda, no actuar sobre algo ajeno.
#
# Y habia una discrepancia de base: el push iba a `.../centinel.git` mientras
# el paso de verificacion consultaba `.../Vigil`. La verificacion miraba un
# repositorio distinto del que escribia, asi que confirmaba lo que encontrase
# alli. Ahora ambos leen de aqui.
#
# English: the mirror destination is declared, neither hardcoded nor guessed.
# Deriving it from the repository name was tried and is wrong -- this repo is
# `Vigil` on GitHub and its mirror is `centinel` -- and Codeberg's
# `Push to create is not enabled for users` shows that with that option on,
# the derivation would have CREATED a repository under the guessed name and
# force-pushed every branch to it. Without `vars.CODEBERG_REPO` the mirror is
# skipped and says so. There was also a base mismatch: the push went to
# `.../centinel.git` while verification queried `.../Vigil`.
env:
  CODEBERG_OWNER: ${{ vars.CODEBERG_OWNER || github.repository_owner }}
  CODEBERG_REPO: ${{ vars.CODEBERG_REPO }}
  CODEBERG_USER: ${{ vars.CODEBERG_USER || github.repository_owner }}

jobs:
  # ----------------------------------------------------------------------
  # JOB 1: Mirror to Codeberg
  # ----------------------------------------------------------------------
  mirror-codeberg:
    if: ${{ !github.event.repository.fork }}
    name: Mirror to Codeberg
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Mandatory for mirroring: we need every commit, branch, and tag.
          # Obligatorio para el espejo: necesitamos cada commit, rama y tag.
          fetch-depth: 0
          # Avoid sparse-checkout — we need everything.
          # Evitar sparse-checkout — necesitamos todo.

      - name: Configure git identity
        run: |
          git config user.name "VectisDev"
          git config user.email "VectisDev@users.noreply.github.com"

      - name: Push to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CODEBERG_TOKEN}" ]; then
            echo "CODEBERG_TOKEN not configured — skipping Codeberg mirror."
            exit 0
          fi

          if [ -z "${CODEBERG_REPO}" ]; then
            {
              echo "### Espejo a Codeberg: omitido"
              echo ""
              echo "Falta la variable de repositorio \`CODEBERG_REPO\`."
              echo ""
              echo "El nombre del espejo no se deduce del nombre en GitHub: pueden"
              echo "diferir, y de hecho difieren en el repositorio original"
              echo "(\`Vigil\` en GitHub, \`centinel\` en Codeberg). Empujar a un"
              echo "nombre adivinado puede crear un repositorio que nadie pidio y"
              echo "llenarlo con \`--force\`, asi que no se hace."
              echo ""
              echo "Para activarlo: Settings → Secrets and variables → Actions →"
              echo "Variables → \`CODEBERG_REPO\` con el nombre del repositorio"
              echo "en Codeberg."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "CODEBERG_REPO no declarada — espejo omitido (no se adivina el destino)."
            exit 0
          fi

          echo "Destino del espejo: codeberg.org/${CODEBERG_OWNER}/${CODEBERG_REPO}.git"

          # Configure Codeberg remote. We use the token in the URL so that
          # it never gets logged in plaintext (the URL is masked by GHA).
          # Configurar remote a Codeberg. Usamos el token en la URL para
          # que nunca se loguee en texto plano.
          CODEBERG_URL="https://${CODEBERG_USER}:${CODEBERG_TOKEN}@codeberg.org/${CODEBERG_OWNER}/${CODEBERG_REPO}.git"
          git remote remove codeberg 2>/dev/null || true
          git remote add codeberg "${CODEBERG_URL}"

          # Push all branches and tags. --force is acceptable because
          # GitHub is the single source of truth; mirrors must follow.
          # Push de todas las ramas y tags. --force es aceptable porque
          # GitHub es la única fuente de verdad; los mirrors siguen.
          echo "::group::Pushing branches"
          for i in 1 2 3 4; do
            git -c http.postBuffer=524288000 push codeberg --all --force && break
            [ "$i" = 4 ] && exit 1
            echo "Codeberg push failed (attempt $i), retrying..."; sleep $((i * 30))
          done
          echo "::endgroup::"

          echo "::group::Pushing tags"
          for i in 1 2 3 4; do
            git -c http.postBuffer=524288000 push codeberg --tags --force && break
            [ "$i" = 4 ] && exit 1
            echo "Codeberg push failed (attempt $i), retrying..."; sleep $((i * 30))
          done
          echo "::endgroup::"

      - name: Verify Codeberg head matches GitHub head
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          # Si no hay destino declarado no se empujo nada, asi que no hay nada
          # que verificar. Consultar con el nombre vacio preguntaria por otro
          # repositorio y reportaria lo que encontrase alli -- exactamente el
          # error que este archivo ya tenia.
          # English: with no declared destination nothing was pushed, so there
          # is nothing to verify. Querying with an empty name would ask about
          # a different repository and report whatever it found there.
          if [ -z "${CODEBERG_REPO}" ]; then
            echo "Sin destino declarado — nada que verificar."
            exit 0
          fi
          if [ -z "${CODEBERG_TOKEN}" ]; then
            echo "CODEBERG_TOKEN not configured — skipping Codeberg mirror."
            exit 0
          fi
          GITHUB_HEAD="$(git rev-parse HEAD)"

          # Query Codeberg API for the same branch HEAD.
          # Consultar la API de Codeberg para el HEAD de la misma rama.
          BRANCH="${GITHUB_REF##*/}"
          CODEBERG_HEAD="$(curl -fsS \
              -H "Authorization: token ${CODEBERG_TOKEN}" \
              "https://codeberg.org/api/v1/repos/${CODEBERG_OWNER}/${CODEBERG_REPO}/branches/${BRANCH}" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["commit"]["id"])' 2>/dev/null || echo "UNKNOWN")"

          echo "GitHub HEAD ($BRANCH):   ${GITHUB_HEAD}"
          echo "Codeberg HEAD ($BRANCH): ${CODEBERG_HEAD}"

          if [[ "${CODEBERG_HEAD}" == "UNKNOWN" ]]; then
            echo "::warning::Could not verify Codeberg HEAD via API (may be a new branch)."
          elif [[ "${GITHUB_HEAD}" != "${CODEBERG_HEAD}" ]]; then
            echo "::error::HEAD mismatch between GitHub and Codeberg"
            exit 1
          else
            echo "✓ Codeberg HEAD matches GitHub HEAD"
          fi

  # ----------------------------------------------------------------------
  # JOB 2: Snapshot bundle to Internet Archive
  # ----------------------------------------------------------------------
  archive-bundle:
    name: Snapshot to Internet Archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true  # Graceful degradation if IA secrets not yet configured.
    # Only run on push events or manual dispatch. Skipping on cron prevents
    # daily growth of the IA collection with redundant bundles.
    # Solo correr en push o disparo manual. Saltar en cron previene el
    # crecimiento diario de la colección IA con bundles redundantes.
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute bundle metadata
        id: meta
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          BRANCH="${GITHUB_REF##*/}"
          TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BUNDLE_NAME="centinel-${TIMESTAMP}-${BRANCH}-${HEAD_SHA:0:12}.bundle"

          echo "head_sha=${HEAD_SHA}"          >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}"              >> "$GITHUB_OUTPUT"
          echo "timestamp=${TIMESTAMP}"        >> "$GITHUB_OUTPUT"
          echo "bundle_name=${BUNDLE_NAME}"    >> "$GITHUB_OUTPUT"

      - name: Create git bundle
        run: |
          set -euo pipefail
          git bundle create "${{ steps.meta.outputs.bundle_name }}" --all

          BUNDLE_SHA=$(sha256sum "${{ steps.meta.outputs.bundle_name }}" | awk '{print $1}')
          echo "Bundle SHA-256: ${BUNDLE_SHA}"
          echo "BUNDLE_SHA=${BUNDLE_SHA}" >> "$GITHUB_ENV"

      - name: Write bundle manifest
        run: |
          set -euo pipefail
          cat > "${{ steps.meta.outputs.bundle_name }}.manifest.json" <<EOF
          {
            "centinel_mirror_manifest_version": 1,
            "tool": "centinel-resilience-mirror",
            "tool_url": "https://github.com/VectisDev/Vigil",
            "bundle_filename": "${{ steps.meta.outputs.bundle_name }}",
            "bundle_sha256": "${BUNDLE_SHA}",
            "git_head_sha": "${{ steps.meta.outputs.head_sha }}",
            "git_branch": "${{ steps.meta.outputs.branch }}",
            "captured_at_utc": "${{ steps.meta.outputs.timestamp }}",
            "trigger_event": "${{ github.event_name }}",
            "github_workflow_run_id": "${{ github.run_id }}",
            "github_workflow_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "instructions_to_verify": [
              "1. Download the .bundle file from this Internet Archive item.",
              "2. Compute: sha256sum <bundle> — must equal bundle_sha256.",
              "3. Clone into a fresh directory: git clone <bundle> centinel-restored",
              "4. Inside, verify git_head_sha: git rev-parse <branch> == ${{ steps.meta.outputs.head_sha }}"
            ]
          }
          EOF

      - name: Check IA secrets are configured
        id: ia_check
        run: |
          if [ -z "${{ secrets.IA_ACCESS_KEY }}" ] || [ -z "${{ secrets.IA_SECRET_KEY }}" ]; then
            echo "::warning::IA_ACCESS_KEY or IA_SECRET_KEY not configured. Skipping Internet Archive upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Internet Archive CLI
        if: steps.ia_check.outputs.skip != 'true'
        run: pip install internetarchive --quiet

      - name: Upload bundle to Internet Archive
        if: steps.ia_check.outputs.skip != 'true'
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          set -euo pipefail
          # Configure IA credentials non-interactively.
          # Configurar credenciales de IA de forma no interactiva.
          mkdir -p ~/.config/internetarchive
          cat > ~/.config/internetarchive/ia.ini <<EOF
          [s3]
          access = ${IA_ACCESS_KEY}
          secret = ${IA_SECRET_KEY}
          EOF

          # Identifier: stable per-month item so we don't create thousands
          # of items. Bundles within the same month land in the same item.
          # Identificador: ítem estable por mes para no crear miles de
          # ítems. Bundles del mismo mes caen en el mismo ítem.
          MONTH=$(date -u +%Y-%m)
          IA_ID="centinel-mirror-${MONTH}"

          ia upload "${IA_ID}" \
              "${{ steps.meta.outputs.bundle_name }}" \
              "${{ steps.meta.outputs.bundle_name }}.manifest.json" \
              --metadata="title:VIGIL Resilience Mirror ${MONTH}" \
              --metadata="description:Periodic git-bundle snapshots of the VIGIL repository, uploaded as part of the project's multi-platform resilience policy. Each bundle is independently verifiable against the GitHub source and SHA-256 hashes recorded in the manifest." \
              --metadata="creator:VIGIL Project (VectisDev)" \
              --metadata="subject:electoral-audit" \
              --metadata="subject:centinel" \
              --metadata="subject:internet-freedom-infrastructure" \
              --metadata="subject:open-source" \
              --metadata="licenseurl:https://www.gnu.org/licenses/agpl-3.0.html" \
              --metadata="mediatype:software" \
              --no-derive \
              --retries 3

          echo "Uploaded to: https://archive.org/details/${IA_ID}"

  # ----------------------------------------------------------------------
  # JOB 3: Update transparency log
  # ----------------------------------------------------------------------
  log-transparency:
    name: Append to transparency log
    runs-on: ubuntu-latest
    needs: [mirror-codeberg, archive-bundle]
    # Run even if archive-bundle was skipped (cron case). The log records the
    # ACTUAL result of each job; it never asserts an archive that did not run.
    if: always() && (needs.mirror-codeberg.result == 'success')

    permissions:
      contents: write  # Required to push the log update.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Append mirror event to transparency log
        run: |
          set -euo pipefail
          mkdir -p docs/transparency
          LOG=docs/transparency/MIRROR-LOG.md

          if [[ ! -f "${LOG}" ]]; then
            cat > "${LOG}" <<'EOF'
          # Resilience Mirror Log

          Each entry below records a mirror operation executed by the
          `Resilience Mirror` GitHub Actions workflow. Entries are append-only.

          Cada entrada registra una operación de espejo ejecutada por el
          workflow `Resilience Mirror`. Las entradas son append-only.

          | UTC Timestamp | Trigger | Git HEAD | Codeberg | Internet Archive |
          |---------------|---------|----------|----------|------------------|
          EOF
          fi

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          HEAD_SHA=$(git rev-parse HEAD)
          HEAD_SHORT="${HEAD_SHA:0:12}"
          TRIGGER="${{ github.event_name }}"
          MONTH=$(date -u +%Y-%m)
          IA_LINK="https://archive.org/details/centinel-mirror-${MONTH}"
          # Sin destino declarado no hubo espejo, y la celda no debe afirmar
          # que lo hubo. Un registro de transparencia que miente sobre una
          # replica es peor que uno que declara su ausencia.
          # English: with no declared destination there was no mirror, and the
          # cell must not claim there was. A transparency log that lies about
          # a replica is worse than one that declares its absence.
          if [ -n "${CODEBERG_REPO}" ]; then
            CODEBERG_CELL="[✓](https://codeberg.org/${CODEBERG_OWNER}/${CODEBERG_REPO}/commit/${HEAD_SHA})"
          else
            CODEBERG_CELL="— (sin destino declarado)"
          fi

          # The Internet Archive cell reports what actually happened. A skipped
          # or failed upload is never recorded as an archive.
          case "${{ needs.archive-bundle.result }}" in
            success) IA_CELL="[✓](${IA_LINK})" ;;
            skipped) IA_CELL="— (not attempted)" ;;
            *)       IA_CELL="✗ (failed)" ;;
          esac

          echo "| ${TIMESTAMP} | ${TRIGGER} | \`${HEAD_SHORT}\` | ${CODEBERG_CELL} | ${IA_CELL} |" >> "${LOG}"

      - name: Publicar el registro en data/mirror-log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/commit_via_api.py \
            --branch data/mirror-log \
            --from main \
            --message "chore(mirror): append mirror event $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -- docs/transparency/MIRROR-LOG.md
