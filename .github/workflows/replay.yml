# El replay es lo que un despliegue nuevo muestra el día uno.
#
# No hay elección que vigilar hasta 2029, así que el modo por defecto reproduce
# 64 capturas reales de una elección disputada y recalcula su raíz de Merkle.
# Si la raíz recalculada no coincide con la comprometida, este workflow falla:
# ese aserto es la prueba de punta a punta de que el pipeline hace lo que dice.
#
# English: the replay is what a fresh deployment shows on day one. It reproduces
# 64 real captures and recomputes their Merkle root; a mismatch fails the job.
name: REPLAY — reproducir el conjunto verificado

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Conjunto a reproducir
        default: tests/fixtures/hnd_2025
      commit:
        description: Commitear web/data/ a la rama
        type: boolean
        default: true
  workflow_call:
    inputs:
      dataset:
        type: string
        default: tests/fixtures/hnd_2025
      commit:
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: vigil-replay-${{ github.repository }}
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    # El original no se reproduce a sí mismo en cada fork.
    # English: the upstream does not replay itself inside every fork.
    if: ${{ !github.event.repository.fork }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/prod.txt

      # El único sitio donde se decide el modo. Si .vigil/mode.yaml falta o no se
      # puede leer, resolve_mode.py devuelve REPLAY: cero peticiones al exterior.
      - name: Resolver modo
        id: mode
        run: python .github/scripts/resolve_mode.py

      # El aserto vive dentro del script, no en el YAML: así la misma garantía
      # aplica cuando alguien lo corre en su portátil.
      # English: the assert lives in the script, so it holds off CI too.
      - name: Reproducir el conjunto y recalcular la raíz de Merkle
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          python scripts/replay_pipeline.py \
            --dataset "${{ inputs.dataset || 'tests/fixtures/hnd_2025' }}" \
            --out web/data

      # Las calendars de OpenTimestamps pueden estar caídas; su caída no es una
      # discrepancia de datos. Se registra, no se falla.
      # English: OTS calendars can be down; that is not a data mismatch.
      - name: Verificar el anclaje a Bitcoin (informativo)
        id: ots
        continue-on-error: true
        run: |
          pip install opentimestamps-client
          ROOT="$(python -c "import json;print(json.load(open('web/data/replay_manifest.json'))['merkle_root'])")"
          PROOF="${{ inputs.dataset || 'tests/fixtures/hnd_2025' }}/MERKLE_ROOT_HN2025.ots"
          if [ ! -f "$PROOF" ]; then
            echo "Sin prueba .ots en $PROOF" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ots verify -d "$ROOT" "$PROOF" 2>&1 | tee ots.log

      - name: Exportar el panel en modo REPLAY
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          python scripts/export_static_snapshot.py \
            --mode "${{ steps.mode.outputs.mode }}" \
            --mode-reason "${{ steps.mode.outputs.reason }}"

      - name: Resumen
        if: always()
        run: |
          {
            echo "## REPLAY"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Modo | \`${{ steps.mode.outputs.mode }}\` |"
            echo "| Motivo | ${{ steps.mode.outputs.reason }} |"
            echo "| Raíz de Merkle | recalculada y coincidente |"
            echo "| Anclaje a Bitcoin | \`${{ steps.ots.outcome }}\` (informativo) |"
            echo ""
            python - <<'PY'
          import json, pathlib
          p = pathlib.Path("web/data/replay_manifest.json")
          if p.exists():
              m = json.loads(p.read_text(encoding="utf-8"))
              print(f"- Capturas reproducidas: **{m.get('files')}**")
              print(f"- Alertas de los detectores reales: **{m.get('alerts')}**")
              print(f"- Raiz: `{m.get('merkle_root')}`")
              print("")
              print(f"> {m.get('note','')}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commitear los datos del replay
        if: ${{ inputs.commit != false }}
        run: |
          git config user.name  'VectisDev'
          git config user.email 'VectisDev@users.noreply.github.com'
          # Indexar solo lo que existe, en vez de tragarse el error de `git add`.
          # Las tres primeras las acaba de escribir el replay; snapshot.json lo
          # escribe el exportador y su ausencia seria un fallo del paso anterior.
          # English: stage only what exists instead of swallowing git add's error.
          for f in web/data/replay_snapshots.json \
                   web/data/alerts.json \
                   web/data/replay_manifest.json \
                   web/data/snapshot.json; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "::error::Falta $f — el replay no produjo lo que dice producir."
              exit 1
            fi
          done
          if git diff --cached --quiet; then
            echo 'Sin cambios en los datos del replay.'
            exit 0
          fi
          git commit -m 'replay: reproducir el conjunto verificado y su raiz de Merkle'
          for intento in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((intento * 4))
          done
          echo '::error::No se pudo empujar los datos del replay.'
          exit 1
