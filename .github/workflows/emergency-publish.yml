name: Emergency Publish

# Triggered by the pipeline server when HIGH/CRITICAL anomalies are detected.
# Only runs export_static_snapshot.py and a signed API commit. No scraping, no audit.
# Latency target: panel updated within ~60 seconds of anomaly detection.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Trigger reason (anomaly type or blackout)'
        required: false
        default: 'anomaly_detected'

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Export static snapshot
        run: python scripts/export_static_snapshot.py
      - name: Commit and push
        run: |
          GH_TOKEN="${{ github.token }}" python3 .github/scripts/commit_via_api.py \
            --branch "${GITHUB_REF_NAME}" \
            --message "data: emergency snapshot [skip ci] reason=${{ inputs.reason }}" \
            -- web/data/snapshot.json

      - name: Push data to centinel-data
        if: always()
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "INFO: DATA_REPO_TOKEN not configured — data stays local"
            exit 0
          fi
          git clone "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${REPO_OWNER}/centinel-data.git" /tmp/centinel-data
          mkdir -p /tmp/centinel-data/snapshots/emergency
          [ -f web/data/snapshot.json ] && cp web/data/snapshot.json /tmp/centinel-data/snapshots/emergency/ || true
          cd /tmp/centinel-data
          GH_TOKEN="$DATA_REPO_TOKEN" python3 "$GITHUB_WORKSPACE/.github/scripts/commit_via_api.py" \
            --repository "${REPO_OWNER}/centinel-data" \
            --branch main \
            --root /tmp/centinel-data \
            --sync \
            --message "data: emergency $(date -u +'%Y-%m-%d %H:%M UTC')" \
            -- .
