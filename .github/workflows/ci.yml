name: CI

on:
  push:
    branches:
      - main
      - work
      - 'dev-v*'
  pull_request:
  workflow_dispatch:

# Security: explicit minimal permissions for all jobs.
permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  lint:
    name: Lint (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Historia completa: los pasos de abajo comparan contra el commit base
          # y leen mensajes de commit. Con el checkout superficial por defecto
          # ese objeto no existe en el clon, `git diff` falla con "bad object",
          # y el fallo se pierde dentro de la sustitucion de proceso: el paso
          # reportaba "No Python file changes detected" y salia en verde sin
          # haber ejecutado flake8 ni black ni una sola vez.
          # English: full history. The steps below diff against the base commit
          # and read commit messages. With the default shallow checkout that
          # object is absent, `git diff` fails with "bad object", and the
          # failure is swallowed by the process substitution: the step reported
          # "No Python file changes detected" and passed without ever running
          # flake8 or black.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flake8>=7.0.0,<8.0.0" "black>=25.0.0,<26.0.0"

      - name: Resolve comparison range
        id: range
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          # Sin base utilizable (primer push a una rama nueva, por ejemplo) se
          # revisa el arbol entero en vez de no revisar nada. Un gate que se
          # salta a si mismo cuando no sabe que comparar no es un gate.
          # English: with no usable base (first push to a new branch) check the
          # whole tree rather than nothing. A gate that skips itself when it
          # cannot tell what to compare is not a gate.
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "No usable base commit; falling back to whole-tree checks."
            exit 0
          fi

          # Que el objeto falte es un error del workflow, no una ausencia de
          # cambios. Antes se confundian y el lint pasaba sin ejecutarse.
          # English: a missing object is a workflow error, not an absence of
          # changes. The two used to be conflated and lint passed without running.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::El commit base ${BASE_SHA} no esta en el checkout. Revisa fetch-depth."
            exit 1
          fi

          echo "base=${BASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Run flake8/black on changed Python files
        shell: bash
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
        run: |
          set -euo pipefail

          if [[ -n "${BASE_SHA}" ]]; then
            mapfile -t changed_py < <(git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}" -- '*.py')
          else
            mapfile -t changed_py < <(git ls-files -- '*.py')
          fi

          if (( ${#changed_py[@]} == 0 )); then
            echo "No Python file changes detected."
            exit 0
          fi

          echo "Comprobando ${#changed_py[@]} archivo(s):"
          printf '  %s\n' "${changed_py[@]}"

          # F401 (import sin uso) se anade porque era lo unico que el bot de
          # auto-heal detectaba y este gate no, y por eso un import muerto llego
          # a un PR. El gate solo mira archivos cambiados, asi que esto no
          # obliga a limpiar todo el arbol de golpe.
          # English: F401 (unused import) is added because it was the only thing
          # the auto-heal bot caught and this gate did not, which is how a dead
          # import reached a PR. The gate only looks at changed files, so this
          # does not force cleaning the whole tree at once.
          python -m flake8 "${changed_py[@]}" --select=E9,F63,F7,F82,F401 --show-source --statistics
          python -m black --check "${changed_py[@]}"

      # Firma unica: ni rutas, ni contenido, ni mensajes de commit pueden
      # nombrar a un asistente de IA. Un mensaje de commit es permanente y
      # publico; corregirlo despues del merge exige reescribir la historia.
      # English: single signature. Neither paths, contents nor commit messages
      # may name an AI assistant. A commit message is permanent and public;
      # fixing it after the merge requires rewriting history.
      - name: Assert single signature (no AI references)
        shell: bash
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]]; then
            python .github/scripts/assert_no_ai_references.py "${BASE_SHA}..${GITHUB_SHA}"
          else
            python .github/scripts/assert_no_ai_references.py
          fi

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements/dev.txt

      # Las pruebas del panel abren un navegador de verdad. Sin este paso se
      # saltaban, y un fallo de pestañas o de color llegaba a Pages sin que
      # el CI lo viera.
      # English: the panel tests open a real browser. Without this step they
      # were skipped, and a tab or colour fault reached Pages unseen.
      - name: Install the browser the panel tests drive
        run: python -m playwright install --with-deps chromium

      # Este job corre la suite COMPLETA: 89 archivos, sin exclusiones.
      # Antes de la serie de arreglos que lo precede, la suite no podia
      # completarse (la coleccion abortaba y una prueba dormia el backoff real)
      # y el CI ejercitaba 2 de 89 archivos. Luego quedaron 19 fallos
      # preexistentes aislados en un job informativo. Ya no hay ninguno, asi
      # que la lista de exclusiones y ese job desaparecen: cualquier rojo aqui
      # es una regresion de verdad, y bloquea.
      #
      # This job runs the WHOLE suite: 89 files, no exclusions. Before the
      # series of fixes preceding it the suite could not complete at all and CI
      # exercised 2 of 89 files; then 19 pre-existing failures sat in a
      # report-only job. There are none left, so the ignore list and that job
      # are gone: any red here is a real regression, and it blocks.
      - name: Run tests
        run: python -m pytest -q --timeout=180

  security-tests:
    name: Security Integration Tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install security test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          python -m pip install "pytest>=9.0.3,<10.0.0" "pytest-asyncio>=0.23,<2.0" python-dateutil psutil pyyaml flask requests bandit cyclonedx-bom apscheduler

      - name: Generate SBOM (CycloneDX)
        run: |
          RELEASE_VERSION_RAW="${GITHUB_REF_NAME:-local}-${GITHUB_SHA::12}"
          RELEASE_VERSION="$(echo "${RELEASE_VERSION_RAW}" | sed 's/[^A-Za-z0-9._-]/-/g')"
          SBOM_FILE="sbom.${RELEASE_VERSION}.cyclonedx.json"
          cyclonedx-py requirements requirements.txt --output-format json --output-file "${SBOM_FILE}"
          test -s "${SBOM_FILE}"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_ENV
          echo "SBOM_FILE=${SBOM_FILE}" >> $GITHUB_ENV

      - name: Run mandatory release gate
        run: |
          # El gate es identico en PR y en main. Antes se saltaba en PR, asi que
          # un PR verde podia poner roja la rama protegida al mergear: es
          # exactamente lo que paso en #785, #786 y #787. Un gate que solo actua
          # despues del merge no es un gate.
          # English: identical on PR and main. It used to be skipped on PRs, so a
          # green PR could turn the protected branch red on merge. A gate that
          # only fires after the merge is not a gate.
          SKIP_LOCK_FLAG=""
          if [[ "${GITHUB_REF_NAME}" == dev-v* || "${GITHUB_REF_NAME}" == "work" ]]; then
            SKIP_LOCK_FLAG="--skip-lock-check"
          fi

          python scripts/release_gate.py \
            --release-version "${RELEASE_VERSION}" \
            --sbom "${SBOM_FILE}" \
            --output artifacts/release_gate_${RELEASE_VERSION}.json \
            ${SKIP_LOCK_FLAG}

      - name: Upload release governance artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-governance-${{ env.RELEASE_VERSION }}
          path: |
            ${{ env.SBOM_FILE }}
            artifacts/release_gate_${{ env.RELEASE_VERSION }}.json
            artifacts/secrets_audit.json

      - name: Run secrets audit gate
        run: |
          python - <<'PY2'
          from datetime import datetime, timezone
          from pathlib import Path

          Path('artifacts').mkdir(parents=True, exist_ok=True)
          Path('artifacts/rotation_policy.json').write_text(
              '{"last_rotated_utc":"' + datetime.now(timezone.utc).isoformat() + '"}',
              encoding='utf-8',
          )
          PY2

          python scripts/secrets_audit.py \
            --rotation-file artifacts/rotation_policy.json \
            --max-age-days 90 \
            --output artifacts/secrets_audit.json

      - name: Run security scans
        run: |
          # El gate es identico en PR y en main. Antes se saltaba en PR, asi que
          # un PR verde podia poner roja la rama protegida al mergear: es
          # exactamente lo que paso en #785, #786 y #787. Un gate que solo actua
          # despues del merge no es un gate.
          # English: identical on PR and main. It used to be skipped on PRs, so a
          # green PR could turn the protected branch red on merge. A gate that
          # only fires after the merge is not a gate.
          if [[ "${GITHUB_REF_NAME}" == dev-v* || "${GITHUB_REF_NAME}" == "work" ]]; then
            bandit -r . -c .github/bandit.yaml --severity-level medium || true
          else
            bandit -r . -c .github/bandit.yaml --severity-level medium
          fi

      - name: Run security suites
        run: |
          # El gate es identico en PR y en main. Antes se saltaba en PR, asi que
          # un PR verde podia poner roja la rama protegida al mergear: es
          # exactamente lo que paso en #785, #786 y #787. Un gate que solo actua
          # despues del merge no es un gate.
          # English: identical on PR and main. It used to be skipped on PRs, so a
          # green PR could turn the protected branch red on merge. A gate that
          # only fires after the merge is not a gate.
          if [[ "${GITHUB_REF_NAME}" == dev-v* || "${GITHUB_REF_NAME}" == "work" ]]; then
            make security || true
          else
            make security
          fi


  resilience-tests:
    name: Resilience Tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install resilience dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=9.0.3,<10.0.0" "pytest-asyncio>=0.23,<2.0" pytest-cov requests responses pyyaml tenacity psutil python-dateutil apscheduler httpx cryptography pydantic python-dotenv defusedxml structlog

      - name: Run resilience suite
        run: |
          python -m pytest tests/resilience/ -v --cov=scripts --cov-report=term-missing --junitxml=resilience.junit.xml

      - name: Build resilience report
        run: |
          python scripts/resilience_report.py \
            --junit-xml resilience.junit.xml \
            --output artifacts/resilience_report.json \
            --release-version "${GITHUB_REF_NAME:-local}"

      - name: Upload resilience artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: resilience-report
          path: |
            resilience.junit.xml
            artifacts/resilience_report.json

  replay-offline:
    name: Offline demo (stdlib)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      # No requirements.txt. The demo must run on the standard library.
      - name: Verify the bundled sample
        run: make replay-offline

  demo-image:
    name: Reproducible demo image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build and run the pinned demo image
        run: |
          set -euo pipefail
          docker build -f Dockerfile.demo -t vigil-demo:local .
          docker run --rm vigil-demo:local

  coverage-core:
    name: Coverage floor (custody and export)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Install what these tests import
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=9.0.3,<10" "coverage>=7,<8" "pyyaml>=6" "cryptography>=50,<51" "scipy>=1.11.4,<2" "numpy>=1.24,<3"

      # Tracing auditor.inconsistent_acts pulls NumPy in twice under coverage
      # and aborts the process. Those tests still run below, untraced. The
      # floor is on the two modules coverage can measure.
      - name: Fail if custody or export coverage drops under 80
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m coverage run --source=vigil.core.custody,scripts.export_static_snapshot \
            -m pytest -o addopts= -q \
            tests/test_custody.py \
            tests/test_export_static_snapshot.py \
            tests/test_verify_chain_standalone.py \
            -p no:cov
          python -m coverage report --fail-under=80

      - name: Run statistics and claim guards
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -o addopts= -q \
            tests/test_inconsistent_acts.py \
            tests/test_claim_guard.py \
            tests/test_preregistration_hash.py
