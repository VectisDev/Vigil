name: Sync Lab Thresholds

# ponytail: candidate for merge into ci.yml as an additional conditional job
# once ci.yml adopts path filters. Keep standalone while ci.yml runs on every push.

on:
  push:
    branches: [main, dev-v12]
    paths:
      - 'command_center/*.yaml'
      - 'config/prod/rate_limiter.yaml'
      - 'scripts/generate_lab_thresholds.py'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Generate lab-thresholds.json
        run: python scripts/generate_lab_thresholds.py

      - name: Commit and push if changed
        run: |
          git config user.email "250608616+userf8a2c4@users.noreply.github.com"
          git config user.name "userf8a2c4"
          git add web/lab-thresholds.json
          git diff --cached --quiet && echo "No changes" || (
            git commit -m "chore: sync lab thresholds from config [skip ci]"
            git push
          )
