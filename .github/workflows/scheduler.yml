name: VIGIL Data Fetcher
#
# Sin horario, a proposito.
#
# Este workflow declaraba `*/15 * * * *` y compartia el grupo de concurrencia
# `centinel-pipeline` con `cancel-in-progress: true` junto a pipeline.yml. Dos
# workflows con horarios distintos en un grupo que cancela significa que el que
# dispara segundo mata al primero en vuelo: la cadencia efectiva se reducia y
# una captura a medias podia quedar truncada.
#
# Ademas duplica lo que audit.yml ya hace mejor: su `git add data/` cae sobre
# una ruta ignorada por .gitignore, asi que no llegaba a commitear nada -- pero
# si emitia las peticiones. Horario fuera; queda el despacho manual, que es
# para lo que de verdad sirve.
#
# English: no schedule, on purpose. This declared */15 and shared a
# cancelling concurrency group with pipeline.yml, so whichever fired second
# killed the other mid-flight. It also duplicates audit.yml, and its `git add
# data/` targets a gitignored path, so it committed nothing while still
# issuing the requests. The schedule is gone; manual dispatch remains.
on:
  workflow_dispatch: # Despacho manual; la captura por horario vive en audit.yml

concurrency:
  group: vigil-capture-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/_gate.yml
    with:
      purpose: scheduler

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps 2>/dev/null || true
      # El modo ya lo resolvio el job `gate`, que es ahora el unico punto de
      # decision. Resolverlo otra vez aqui seria una segunda fuente de verdad
      # que puede discrepar de la primera si la ventana electoral se cruza
      # entre los dos jobs.
      # English: the mode was already resolved by the `gate` job, now the one
      # decision point. Resolving it again here would be a second source of
      # truth that can disagree with the first.
      - name: Run collector
        run: python -m scripts.download_and_hash
      - name: Commit data
        run: |
          git config --global user.name "VectisDev"
          git config --global user.email "VectisDev@users.noreply.github.com"
          git add data/
          git commit -m "Auto-update: New snapshot collected" || exit 0
          git push

      - name: Push data to centinel-data
        # `always()` para que un fallo de la captura no impida subir lo que si
        # se obtuvo. El job entero solo existe si el gate dijo que si, asi que
        # la condicion de modo ya no hace falta aqui.
        # English: `always()` so a collection failure does not block pushing
        # whatever was obtained. The job only exists if the gate said yes.
        if: always()
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "INFO: DATA_REPO_TOKEN not configured — data stays local"
            exit 0
          fi
          git clone "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${REPO_OWNER}/centinel-data.git" /tmp/centinel-data
          [ -d data ] && cp -r data/. /tmp/centinel-data/snapshots/ || true
          cd /tmp/centinel-data
          git config user.name "VectisDev"
          git config user.email "VectisDev@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main
