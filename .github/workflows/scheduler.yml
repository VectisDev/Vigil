name: VIGIL Data Fetcher
on:
  schedule:
    - cron: '*/15 * * * *' # Corre cada 15 minutos
  workflow_dispatch: # Permite correrlo manual

# Cancel any in-progress run before starting a new one.
concurrency:
  group: centinel-pipeline
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps 2>/dev/null || true
      # El marcador ELECTION_CLOSED hacia `exit 0` dentro de su propio paso, lo
      # que termina ESE paso y no el job: los pasos siguientes se ejecutaban
      # igualmente. El unico freno a la captura era decorativo.
      # English: the ELECTION_CLOSED marker did `exit 0` inside its own step,
      # ending THAT step and not the job, so the steps below ran anyway. The
      # only brake on collection was decorative.
      - name: Resolve node mode
        id: mode
        run: python .github/scripts/resolve_mode.py

      - name: Explain why nothing was collected
        if: steps.mode.outputs.go != 'true'
        run: |
          echo "Modo ${{ steps.mode.outputs.mode }}: no se captura nada."
          echo "Motivo: ${{ steps.mode.outputs.reason }}"
          echo "Cero peticiones a la fuente. Esto no es un fallo."

      - name: Run collector
        if: steps.mode.outputs.go == 'true'
        run: python -m scripts.download_and_hash
      - name: Commit data
        if: steps.mode.outputs.go == 'true'
        run: |
          git config --global user.name "VectisDev"
          git config --global user.email "VectisDev@users.noreply.github.com"
          git add data/
          git commit -m "Auto-update: New snapshot collected" || exit 0
          git push

      - name: Push data to centinel-data
        # `always()` para que un fallo de la captura no impida subir lo que si
        # se obtuvo; `go` para no subir nada cuando no se capturo nada.
        # English: `always()` so a collection failure does not block pushing
        # whatever was obtained; `go` so nothing is pushed when nothing ran.
        if: always() && steps.mode.outputs.go == 'true'
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "INFO: DATA_REPO_TOKEN not configured — data stays local"
            exit 0
          fi
          git clone "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${REPO_OWNER}/centinel-data.git" /tmp/centinel-data
          [ -d data ] && cp -r data/. /tmp/centinel-data/snapshots/ || true
          cd /tmp/centinel-data
          git config user.name "VectisDev"
          git config user.email "VectisDev@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main
