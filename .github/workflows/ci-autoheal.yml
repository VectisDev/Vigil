name: CI Auto-Heal

# Reports Black and unused-import diffs. It does not check out a pull request
# head, does not run on pull_request or workflow_run, and does not write a cache.
# A person starts it by hand on a branch they already trust.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo reportar, no commitear (dry-run)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-autoheal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autoheal:
    name: Auto-Heal (format + imports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Install healing tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "black>=25.0.0,<26.0.0" "autoflake>=2.3.0,<3.0.0"

      - name: Report format on this branch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_py < <(git ls-files '*.py' | { grep -v -E '^tests/fixtures/' || true; })
          if (( ${#changed_py[@]} == 0 )); then
            echo "No Python files."
            exit 0
          fi
          python -m autoflake \
            --in-place --remove-all-unused-imports --remove-unused-variables \
            --ignore-init-module-imports \
            "${changed_py[@]}"
          python -m black "${changed_py[@]}"
          if git diff --quiet; then
            echo "Nothing to heal — files already clean."
            exit 0
          fi
          {
            echo "## Formato por corregir"
            echo
            echo "Este workflow no empuja a la rama y no lee la cabeza de un pull request."
            echo
            echo '```diff'
            git --no-pager diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git --no-pager diff --stat
