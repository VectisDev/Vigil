name: Pace lock

# Refuses a pace past the respectful ceiling unless that commit is signed.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Install the parser
        run: python3 -m pip install --quiet "PyYAML>=6,<7"

      - name: Refuse an unsigned override
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_rate_override.py
