name: Regenerate Admin Seeds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Para disparar pages.yml al final. Un push hecho con GITHUB_TOKEN no
      # dispara workflows, asi que sin esto la web se queda con los hashes
      # viejos y las claves nuevas dan "Clave incorrecta".
      # English: to dispatch pages.yml at the end. A push made with
      # GITHUB_TOKEN does not trigger workflows, so without this the site
      # keeps the old hashes and the new keys read as wrong.
      actions: write
    steps:
      - name: Require a repository admin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          perm=""
          if perm="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq '.permission')"; then
            if [ "$perm" = "admin" ]; then
              echo "Repository permission is admin."
              exit 0
            fi
          fi
          role="$(gh api "orgs/${GITHUB_REPOSITORY_OWNER}/memberships/${GITHUB_ACTOR}" --jq '.role' || true)"
          if [ "$role" = "admin" ]; then
            echo "Organization membership role is admin."
            exit 0
          fi
          echo "Refusing: ${GITHUB_ACTOR} is not a repository admin."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Write hashes
        env:
          FORCE_REGENERATE: "true"
        run: python3 .github/scripts/wizard_seeds.py

      - name: Commit the hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- web/access.json
          git diff --cached --quiet && exit 0
          python3 .github/scripts/commit_via_api.py \
            --branch "${GITHUB_REF_NAME}" \
            --message "Regenerate access key hashes" \
            -- web/access.json

      # Publicar la web con los hashes nuevos.
      #
      # Este es el eslabon que faltaba. El paso anterior commitea
      # web/access.json con GITHUB_TOKEN, y GitHub no dispara workflows con
      # eventos originados por ese token -- es su proteccion contra ejecuciones
      # recursivas. pages.yml escucha `push` sobre `web/**`, asi que nunca se
      # enteraba: la persona regeneraba sus claves, la pagina seguia sirviendo
      # los hashes viejos, y la clave nueva daba "Clave incorrecta" sin que
      # nada explicara por que. Hasta hoy habia que disparar Pages a mano.
      #
      # `workflow_dispatch` es la excepcion documentada a esa proteccion: los
      # eventos workflow_dispatch y repository_dispatch si crean ejecucion
      # aunque los origine GITHUB_TOKEN.
      #
      # English: the missing link. The previous step commits web/access.json
      # with GITHUB_TOKEN, and GitHub does not trigger workflows from events
      # that token originates -- its recursion guard. pages.yml listens for
      # `push` on `web/**`, so it never heard: the person regenerated their
      # keys, the site kept serving the old hashes, and the new key read as
      # wrong with nothing explaining why. `workflow_dispatch` is the
      # documented exception -- it does create a run even from GITHUB_TOKEN.
      - name: Publish the site with the new hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"; then
            echo "Pages dispatched; the new hashes are live in about two minutes."
          else
            # No se falla el job: las claves YA se regeneraron y el archivo de
            # abajo es la unica copia. Perderlo por un fallo de publicacion
            # seria peor que publicar tarde.
            # English: the job does not fail -- the keys are ALREADY
            # regenerated and the file below is the only copy. Losing it to a
            # publish failure would be worse than publishing late.
            echo "::warning::No se pudo disparar pages.yml. Dispáralo a mano para publicar los hashes nuevos."
          fi

      - name: Upload the one-day key file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: centinel-seeds-DESCARGAR-Y-GUARDAR-FUERA-DE-LINEA
          path: /tmp/centinel-seeds.txt
          retention-days: 1
