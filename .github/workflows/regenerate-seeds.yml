name: Regenerate Admin Seeds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Install the parser
        run: python3 -m pip install --quiet "PyYAML>=6,<7"

      - name: Write salted hashes
        env:
          FORCE_REGENERATE: "true"
        run: python3 .github/scripts/wizard_seeds.py

      - name: Commit the hashes
        run: |
          git config user.name "VectisDev"
          git config user.email "287128931+VectisDev@users.noreply.github.com"
          git add config/ops_keys.yml
          git diff --cached --quiet || git commit -m "Regenerate ops key hashes"
          git push

      - name: Upload the one-time key file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vigil-keys-download-once
          path: ${{ runner.temp }}/vigil-seeds.txt
          retention-days: 1
