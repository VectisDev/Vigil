name: Regenerate Admin Seeds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require a repository admin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          perm=""
          if perm="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq '.permission')"; then
            if [ "$perm" = "admin" ]; then
              echo "Repository permission is admin."
              exit 0
            fi
          fi
          role="$(gh api "orgs/${GITHUB_REPOSITORY_OWNER}/memberships/${GITHUB_ACTOR}" --jq '.role' || true)"
          if [ "$role" = "admin" ]; then
            echo "Organization membership role is admin."
            exit 0
          fi
          echo "Refusing: ${GITHUB_ACTOR} is not a repository admin."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Write hashes
        env:
          FORCE_REGENERATE: "true"
        run: python3 .github/scripts/wizard_seeds.py

      - name: Commit the hashes
        run: |
          git config user.name "VectisDev"
          git config user.email "287128931+VectisDev@users.noreply.github.com"
          git add -- web/access.json
          git diff --cached --quiet || git commit -m "Regenerate access key hashes"
          git push

      - name: Upload the one-day key file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: centinel-seeds-DESCARGAR-Y-GUARDAR-FUERA-DE-LINEA
          path: /tmp/centinel-seeds.txt
          retention-days: 1
