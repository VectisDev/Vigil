name: Heal Web Files

on:
  schedule:
    - cron: "0 6 * * *"   # diario a las 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo reportar, no restaurar (dry-run)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Run healer
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          python scripts/heal_web.py $FLAGS

      - name: Commit restored files (if any)
        run: |
          git config user.name "userf8a2c4"
          git config user.email "250608616+userf8a2c4@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "heal: restore missing/corrupt web files [bot]"
            git push
          else
            echo "Nothing to restore."
          fi
