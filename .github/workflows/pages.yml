name: Deploy web verifier to GitHub Pages

# El setup-wizard activa Pages automáticamente al hacer fork.
# Si falla, abre un Issue con un link directo a Settings → Pages.
# URL: https://vectisdev.github.io/centinel/
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml", "tests/fixtures/hnd_2025/**", "scripts/calibrate_2025.py", "scripts/generate_country_series.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python for calibration
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Regenerate HND-2025 calibration data
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-dateutil
          python scripts/calibrate_2025.py --data tests/fixtures/hnd_2025/ --output-dir /tmp/calibration
          cp /tmp/calibration/calibration_2025.json web/data/calibration_hnd_2025.json
        continue-on-error: true  # deploy even if calibration fails (static JSON still in repo)

      - name: Generate HND-2025 time-series for panel replay
        run: python scripts/generate_country_series.py
        continue-on-error: true  # deploy even if generation fails (static JSON still in repo)

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
